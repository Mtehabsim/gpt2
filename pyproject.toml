[project]
name = "gpt2-from-scratch"
version = "0.1.0"
description = "My independent GPT-2 implementation, inspired by ARENA 1.1"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "einops>=0.8",
    "jaxtyping>=0.2",
    "transformer-lens==4.2.0",
    "transformers>=4.40,<6",
    "datasets>=3",
    "wandb>=0.19",
    "rich>=13",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# This is a standalone learning project, not a distributable library.
[tool.uv]
package = false

[tool.ruff.lint]
ignore = ["F722"]